name: Gerar audios ElevenLabs

on:
  workflow_dispatch:
    inputs:
      force:
        description: Regenerar os MP3 existentes
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar audios
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          FORCE_REGENERATE: ${{ inputs.force }}
        run: node scripts/generate-elevenlabs-audio.mjs
      - name: Salvar MP3s
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/elevenlabs
          if git diff --cached --quiet; then
            echo "Nenhum audio novo."
          else
            git commit -m "Generate ElevenLabs prayer audios"
            git push
          fi

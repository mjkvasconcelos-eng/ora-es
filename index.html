<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><meta name="description" content="Voz do Pai — orar é falar com Deus.">
<link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>Voz do Pai</title>
</head>
<body>
<div class="app">
<header class="top"><button class="round" id="menuBtn" aria-label="Menu">☰</button><div class="brand"><div class="brand-mark">🎙</div><div class="brand-name">Voz do Pai</div><div class="brand-sub">ORAR É FALAR COM DEUS</div></div><button class="round" id="searchBtn" aria-label="Pesquisar">⌕</button></header>
<main>
<section class="daily-card" id="daily">
<div class="daily-head"><span>☼ &nbsp;Oração do Dia</span><span id="dateLabel">05 de Setembro</span></div>
<div class="daily-body"><div class="daily-copy"><p>Senhor, entrego este dia em Tuas mãos.<br>Guia os meus passos, guarda o meu coração<br>e me dá força para vencer cada desafio.<br>Que a Tua presença seja o meu sustento<br>e a Tua paz, o meu refrigério. Amém.</p><button class="pray-btn" id="dailyPray">🙏 &nbsp; Quero Orar</button></div><div class="cross-art">✝</div></div>
</section>
<section class="content-section"><div class="section-title"><h2>Categorias</h2><button id="allCategories">Ver todas</button></div><div class="categories" id="categoryGrid">
<button class="category" data-open="gratitude"><span>🧎</span><b>Gratidão</b><small>28 orações</small></button><button class="category" data-open="protection"><span>♥</span><b>Proteção</b><small>32 orações</small></button><button class="category" data-open="family"><span>👨‍👩‍👧</span><b>Família</b><small>25 orações</small></button><button class="category" data-open="peace"><span>🕊</span><b>Paz</b><small>30 orações</small></button><button class="category" data-open="health"><span>✚</span><b>Cura</b><small>27 orações</small></button><button class="category extra" data-open="faith"><span>✦</span><b>Fé</b><small>24 orações</small></button><button class="category extra" data-open="guidance"><span>⌖</span><b>Direção</b><small>22 orações</small></button><button class="category extra" data-open="work"><span>▣</span><b>Trabalho</b><small>20 orações</small></button></div></section>
<section class="content-section fav-section"><div class="section-title"><h2>Favoritas</h2><button id="seeFavs">Ver todas</button></div><div id="favorites" class="favorite-list"></div></section>
</main>
<nav class="bottom-nav"><button class="active" data-nav="home"><span>⌂</span><small>Início</small></button><button data-nav="prayers"><span>▢</span><small>Orações</small></button><button class="center-pray" id="centerPray"><span>🙏</span><small>Orar</small></button><button data-nav="favorites"><span>♡</span><small>Favoritas</small></button><button data-nav="profile"><span>♙</span><small>Perfil</small></button></nav>
</div>
<div class="search-panel hidden" id="searchPanel"><div class="search-box"><input id="searchInput" placeholder="Pesquisar oração..." autofocus><button id="closeSearch">×</button></div><div id="searchResults"></div></div>
<dialog id="prayerDialog"><button class="dialog-close" id="closeDialog">×</button><div class="dialog-icon" id="dialogEmoji">🙏</div><h2 id="dialogTitle"></h2><p id="dialogText"></p><div class="dialog-actions"><button class="pray-btn" id="speakBtn">🔊 Ouvir</button><button class="secondary" id="favBtn">♡ Favoritar</button><button class="secondary" id="shareBtn">↗ Compartilhar</button></div></dialog>
<script src="app.js"></script>
</body></html>

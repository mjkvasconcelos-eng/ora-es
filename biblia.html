<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><title>Bíblia Sagrada — Voz do Pai</title>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="biblia.css">
</head>
<body class="bible-page">
<header class="bible-toolbar">
  <button class="bible-icon" id="backBible" aria-label="Voltar">←</button>
  <div class="bible-title"><strong>Bíblia Sagrada</strong><small id="resumeLabel">Leitura salva automaticamente</small></div>
  <label class="bible-icon file-button" aria-label="Selecionar PDF">＋<input id="pdfFile" type="file" accept="application/pdf"></label>
</header>
<section class="bible-controls">
  <button id="prevPage">‹</button>
  <label>Página <input id="pageNumber" type="number" min="1" value="1"> <span id="pageCount">/ —</span></label>
  <button id="nextPage">›</button>
</section>
<main class="pdf-reader"><div id="loading">Carregando a Bíblia…</div><canvas id="pdfCanvas"></canvas></main>
<footer class="bible-footer"><button id="continueBtn" class="pray-btn">▶ Continuar leitura</button><button id="resetBtn" class="secondary">↺ Voltar ao início</button></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="biblia.js"></script>
</body>
</html>
